name: Test

on:
  push:
  pull_request:

jobs:
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Phase 1-3 tests need the runtime deps plus langgraph (orchestration) and
      # the test runner. The anthropic SDK is not required — LLM calls are
      # mocked — and cloud SDKs come online with Phase 4/5.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pydantic>=2,<3" "pydantic-settings>=2,<3" "structlog>=24" \
                      "langgraph>=0.2,<0.3" "fastapi>=0.110,<1" "uvicorn>=0.29,<1" \
                      "httpx>=0.27,<0.28" \
                      "pytest>=8,<9" "pytest-asyncio>=0.23,<0.24"
      - name: Run tests
        run: pytest tests -q
