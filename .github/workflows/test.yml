name: Test

on:
  push:
  pull_request:

jobs:
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Phase 1 tests need only the always-installed runtime deps plus the test
      # runner. Heavier integration deps (anthropic, langgraph, cloud SDKs) come
      # online with the phases that use them.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pydantic>=2,<3" "pydantic-settings>=2,<3" "structlog>=24" \
                      "pytest>=8,<9" "pytest-asyncio>=0.23,<0.24"
      - name: Run unit tests
        run: pytest tests/unit -q
