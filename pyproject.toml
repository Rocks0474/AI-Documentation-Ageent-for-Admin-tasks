[tool.poetry]
name = "ai-hr-agent-team"
version = "0.1.0"
description = "AI Global HR Agent Team — nine-agent orchestration system for global HR functions"
authors = ["AI HR Agent Team"]
readme = "README.md"
packages = [
    { include = "agents" },
    { include = "adapters" },
    { include = "schemas" },
    { include = "pii_gateway" },
    { include = "orchestration" },
    { include = "config" },
    { include = "integrations" },
    { include = "service" },
]

[tool.poetry.dependencies]
python = "^3.11"
anthropic = "^0.40.0"
langgraph = "^0.2.0"
pydantic = "^2.0"
pydantic-settings = "^2.0"
fastapi = "^0.110"
uvicorn = "^0.29"

# Cloud SDKs — Layer 3 only, never imported in agents/
google-cloud-storage = { version = "*", optional = true }
google-cloud-pubsub = { version = "*", optional = true }
google-cloud-secret-manager = { version = "*", optional = true }
google-cloud-scheduler = { version = "*", optional = true }
google-cloud-aiplatform = { version = "*", optional = true }
boto3 = { version = "*", optional = true }
opensearch-py = { version = "*", optional = true }

# Durable HITL checkpointer (production) — Layer 3 only
langgraph-checkpoint-postgres = { version = "*", optional = true }
psycopg = { version = "*", optional = true, extras = ["binary", "pool"] }

# Always installed
httpx = "^0.27"
structlog = "^24.0"      # Structured logging for audit trail
tenacity = "^9.0"        # Retry logic for adapter calls

[tool.poetry.extras]
postgres = ["langgraph-checkpoint-postgres", "psycopg"]
gcp = [
    "google-cloud-storage",
    "google-cloud-pubsub",
    "google-cloud-secret-manager",
    "google-cloud-scheduler",
    "google-cloud-aiplatform",
]
aws = ["boto3", "opensearch-py"]

[tool.poetry.dev-dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.23"
mypy = "^1.0"
ruff = "^0.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# -----------------------------------------------------------------------------
# Tooling configuration
# -----------------------------------------------------------------------------

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["local_storage"]

[tool.ruff.lint]
# Correctness/security profile. `UP` (pyupgrade) is intentionally NOT selected:
# the architecture spec establishes a house style using `Optional[...]` and
# `(str, Enum)` that later phases copy from, and we keep the codebase
# internally consistent with it.
select = ["E", "F", "I", "B", "S"]
# S307 (eval) is deliberately allowed only inside the ER compliance module,
# where it is suppressed inline with a `# noqa: S307` and a controlled ruleset.

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom puts Depends()/etc. in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # asserts are expected in tests
# These are secret *reference names* (looked up in the SecretsAdapter), not
# secret values — S105 (hardcoded password) is a false positive here.
"config/settings.py" = ["S105"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
